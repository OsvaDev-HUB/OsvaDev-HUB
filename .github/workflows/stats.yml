# Actualiza la ventana de stats del perfil una vez al dia
name: Actualizar stats

on:
  schedule:
    - cron: "0 9 * * *"  # todos los dias a las 9:00 UTC (6:00 en Chile)
  workflow_dispatch:      # permite ejecutarla a mano desde la pestaña Actions

# El token automatico solo puede escribir en este repo para subir el SVG
permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Generar el SVG de stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generar_stats.py

      - name: Subir el SVG si cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git diff --staged --quiet || (git commit -m "chore: Se actualizan las stats del perfil" && git push)
