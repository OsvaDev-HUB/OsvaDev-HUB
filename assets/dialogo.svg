<svg xmlns="http://www.w3.org/2000/svg" width="776" height="208" viewBox="0 0 776 208" role="img" aria-label="Osvaldo dice: Transformo problemas reales en software confiable, desde interfaces cuidadas y APIs seguras hasta bases de datos, automatización y herramientas de escritorio. Me gusta entender cada problema de principio a fin. Estoy abierto a colaborar y a proyectos de código abierto. Siempre creando. Siempre aprendiendo. Siempre avanzando.">
  <style>
    /* Flecha de "continuar" que parpadea como en los juegos */
    .continuar { animation: parpadeo 1s steps(1) infinite; }
    @keyframes parpadeo { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .continuar { animation: none; } }
  </style>

  <g shape-rendering="crispEdges">
    <!-- Cuadro de dialogo con sombra pixelada -->
    <polygon transform="translate(4 4)" fill="#2E1065" points="4,14 768,14 768,18 772,18 772,200 768,200 768,204 4,204 4,200 0,200 0,18 4,18" />
    <polygon fill="#8B5CF6" points="4,14 768,14 768,18 772,18 772,200 768,200 768,204 4,204 4,200 0,200 0,18 4,18" />
    <polygon fill="#140D26" points="8,18 764,18 764,22 768,22 768,196 764,196 764,200 8,200 8,196 4,196 4,22 8,22" />

    <!-- Placa con el nombre de quien habla -->
    <polygon fill="#C084FC" points="28,0 140,0 140,4 144,4 144,24 140,24 140,28 28,28 28,24 24,24 24,4 28,4" />

    <!-- Marco del retrato -->
    <polygon fill="#8B5CF6" points="28,44 140,44 140,48 144,48 144,164 140,164 140,168 28,168 28,164 24,164 24,48 28,48" />
  </g>

  <!-- Retrato recortado de la ilustracion -->
  <clipPath id="retrato"><polygon points="32,48 136,48 136,52 140,52 140,160 136,160 136,164 32,164 32,160 28,160 28,52 32,52" /></clipPath>
  <image x="28" y="48" width="112" height="116" preserveAspectRatio="xMidYMid slice" clip-path="url(#retrato)" href="data:image/webp;base64," />

  <g font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace" text-rendering="geometricPrecision">
    <text x="84" y="19" font-size="14" font-weight="700" fill="#140D26" text-anchor="middle">Osvaldo</text>

    <g font-size="14" fill="#F3E8FF">
      <text x="168" y="58">Transformo problemas reales en software confiable: desde</text>
      <text x="168" y="80">interfaces cuidadas y APIs seguras hasta bases de datos,</text>
      <text x="168" y="102">automatización y herramientas de escritorio. Me gusta</text>
      <text x="168" y="124">entender cada problema de principio a fin.</text>
      <text x="168" y="146">Estoy abierto a colaborar y a proyectos de código abierto.</text>
    </g>
    <text x="168" y="178" font-size="14" font-style="italic" fill="#C084FC">Siempre creando. Siempre aprendiendo. Siempre avanzando.</text>
  </g>

  <!-- Flecha pixelada de continuar -->
  <path class="continuar" shape-rendering="crispEdges" fill="#C084FC" d="M736 176h16v4h-16zM740 180h8v4h-8zM742 184h4v4h-4z" />
</svg>
