<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="564" height="100" viewBox="0 0 564 100" shape-rendering="crispEdges" role="img" aria-label="Visita mi portafolio en osvadevhub.cl">
  <style>
    /* Cursor que parpadea como en una terminal */
    .cursor { animation: parpadeo 1.1s steps(1) infinite; }
    @keyframes parpadeo { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
  <defs>
    <clipPath id="esquinas-logo">
      <rect x="20" y="20" width="56" height="56" rx="12" />
    </clipPath>
  </defs>

  <!-- Sombra pixelada -->
  <polygon transform="translate(4 4)" fill="#2E1065" points="4,0 556,0 556,4 560,4 560,92 556,92 556,96 4,96 4,92 0,92 0,4 4,4" />
  <!-- Borde y fondo con esquinas escalonadas -->
  <polygon fill="#A855F7" points="4,0 556,0 556,4 560,4 560,92 556,92 556,96 4,96 4,92 0,92 0,4 4,4" />
  <polygon fill="#140D26" points="8,4 552,4 552,8 556,8 556,88 552,88 552,92 8,92 8,88 4,88 4,8 8,8" />
  <rect x="8" y="4" width="544" height="3" fill="#2A1A52" />

  <!-- Logo OD del banner -->
  <image x="20" y="20" width="56" height="56" clip-path="url(#esquinas-logo)" href="data:image/png;base64," />

  <g font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace" text-rendering="geometricPrecision">
    <text x="96" y="39" font-size="20" font-weight="700" fill="#F3E8FF">Visita mi portafolio</text>

    <!-- Barra de direccion con el link -->
    <rect x="96" y="50" width="440" height="28" fill="#0B0618" stroke="#5B3A9E" stroke-width="2" />
    <text x="108" y="69" font-size="15" fill="#7C6AA8" textLength="72" lengthAdjust="spacingAndGlyphs">https://</text>
    <text x="180" y="69" font-size="15" font-weight="700" fill="#E9D5FF" textLength="117" lengthAdjust="spacingAndGlyphs">osvadevhub.cl</text>
    <rect class="cursor" x="300" y="56" width="8" height="16" fill="#C084FC" />
  </g>
</svg>
