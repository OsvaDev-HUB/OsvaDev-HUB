<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title description">
  <title id="title">Perfil de desarrollador de Osvaldo Uhart en estilo Fastfetch</title>
  <desc id="description">Resumen inspirado en una terminal sobre el rol, ubicación, estudios, enfoque, tecnologías, datos, plataforma y estado actual de Osvaldo Uhart.</desc>

  <defs>
    <linearGradient id="terminalBackground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity=".35" />
    </filter>
    <style>
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .label { fill: #58a6ff; font-size: 17px; font-weight: 700; }
      .value { fill: #c9d1d9; font-size: 17px; }
      .muted { fill: #8b949e; }
    </style>
  </defs>

  <rect x="16" y="16" width="1068" height="398" rx="18" fill="url(#terminalBackground)" stroke="#30363d" stroke-width="2" filter="url(#shadow)" />
  <path d="M16 66h1068" stroke="#30363d" stroke-width="2" />

  <circle cx="48" cy="41" r="7" fill="#ff5f57" />
  <circle cx="72" cy="41" r="7" fill="#febc2e" />
  <circle cx="96" cy="41" r="7" fill="#28c840" />
  <text x="126" y="47" class="mono" fill="#8b949e" font-size="15">osvaldo@github: ~</text>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="65" y="103" width="108" height="138" rx="42" stroke="#58a6ff" stroke-width="18" />
    <path d="M211 106v78c0 37 18 57 52 57s52-20 52-57v-78" stroke="#3fb950" stroke-width="18" />
    <path d="M82 270h216" stroke="#30363d" stroke-width="2" />
  </g>

  <text x="68" y="304" class="mono" fill="#3fb950" font-size="17" font-weight="700">OsvaDev-HUB</text>
  <text x="68" y="329" class="mono" fill="#8b949e" font-size="15">Río Bueno · Chile</text>

  <g class="mono">
    <text x="430" y="105" fill="#f0f6fc" font-size="22" font-weight="700">osvaldo@github</text>
    <text x="430" y="130" fill="#30363d" font-size="17">────────────────────────────────────────────</text>

    <text x="430" y="165" class="label">rol</text>
    <text x="570" y="165" class="value">Analista Programador · Desarrollador Full Stack</text>

    <text x="430" y="197" class="label">estudios</text>
    <text x="570" y="197" class="value">INACAP · Chile</text>

    <text x="430" y="229" class="label">enfoque</text>
    <text x="570" y="229" class="value">Ingeniería de producto · seguridad · UX</text>

    <text x="430" y="261" class="label">tecnologías</text>
    <text x="570" y="261" class="value">JavaScript · TypeScript · Node.js · React</text>

    <text x="430" y="293" class="label">datos</text>
    <text x="570" y="293" class="value">PostgreSQL · Supabase · MongoDB</text>

    <text x="430" y="325" class="label">plataforma</text>
    <text x="570" y="325" class="value">Linux · Git · Docker · Electron · .NET</text>

    <text x="430" y="357" class="label">estado</text>
    <text x="570" y="357" fill="#3fb950" font-size="17">creando software para problemas reales</text>
  </g>

  <text x="42" y="391" class="mono" fill="#3fb950" font-size="15">$</text>
  <text x="58" y="391" class="mono" fill="#8b949e" font-size="15">fastfetch --profile OsvaDev-HUB</text>
  <rect x="330" y="379" width="11" height="11" rx="2" fill="#58a6ff" />
  <rect x="347" y="379" width="11" height="11" rx="2" fill="#3fb950" />
  <rect x="364" y="379" width="11" height="11" rx="2" fill="#f0883e" />
  <rect x="381" y="379" width="11" height="11" rx="2" fill="#a371f7" />
